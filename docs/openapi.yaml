openapi: 3.0.3
info:
  title: SKKU Alumni API
  version: 0.0.1
  description: 실제 컨트롤러·DTO 기준 문서입니다. 날짜와 타임스탬프 형식은 JDBC 드라이버 및 서버 직렬화 설정에 따라 달라질 수 있습니다. 회원 LIMITED는 신분증, 공지 조회 및 자격 증명 관리만
    허용됩니다. 관리자 API는 관리자 인증과 역할 검사가 필요합니다. 관리자 중 ASIS 전용 계정은 ASIS 최신화 API만 이용하며 운영자 계정 관리 및 문의 알림 메일 설정에는 사무총장 권한이 필요합니다.
paths:
  /api/v1/admin/officer-terms:
    post:
      summary: 임기 생성
      description: 기존 임기와 기간 또는 대·기가 겹치면 409를 반환합니다. 현재 여부는 날짜를 기준으로 결정됩니다.
      security:
      - bearerAuth: []
      - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - generation
              - phase
              - startedAt
              - endedAt
              properties:
                generation:
                  type: integer
                  minimum: 1
                phase:
                  type: integer
                  minimum: 1
                  maximum: 2
                startedAt:
                  type: string
                  format: date
                endedAt:
                  type: string
                  format: date
            example:
              generation: 41
              phase: 1
              startedAt: '2027-05-01'
              endedAt: '2028-04-30'
      responses:
        '200':
          description: 생성된 임기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerTerm'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 인증 필요
        '403':
          description: 권한 없음. 보안 필터 또는 컨트롤러에서 반환합니다.
        '409':
          $ref: '#/components/responses/Error'
        default:
          description: 요청 오류 또는 서버 오류. 컨트롤러 오류는 code와 message를 반환하며 보안 필터 응답은 형식이 다를 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
      operationId: post_api_v1_admin_officer_terms
    get:
      operationId: AdminFeatureController_findOfficerTerms_568d3d9
      tags:
      - AdminFeatureController
      x-source: com.scg.alumni.api.operations.AdminFeatureController#findOfficerTerms
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    generation:
                      type: integer
                    phase:
                      type: integer
                    startedAt:
                      type: string
                      format: date
                    endedAt:
                      type: string
                      format: date
                    currentTerm:
                      oneOf:
                      - type: boolean
                      - type: integer
        '401':
          description: 인증 필요
        '403':
          description: 권한 없음. 보안 필터 또는 컨트롤러에서 반환합니다.
        default:
          description: 요청 오류 또는 서버 오류. 컨트롤러 오류는 code와 message를 반환하며 보안 필터 응답은 형식이 다를 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
      security:
      - bearerAuth: []
      - adminCookie: []
  /api/v1/admin/officer-terms/{id}/activate:
    post:
      summary: 현재 임기로 전환
      description: 호환용 API입니다. 현재 날짜에 해당하는 임기만 성공하며 현행 임기는 날짜를 기준으로 자동 결정됩니다.
      security:
      - bearerAuth: []
      - adminCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 활성화 결과
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - currentTerm
                properties:
                  id:
                    type: integer
                    format: int64
                  currentTerm:
                    type: boolean
                    enum:
                    - true
        '401':
          description: 인증 필요
        '403':
          description: 권한 없음. 보안 필터 또는 컨트롤러에서 반환합니다.
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          description: 요청 오류 또는 서버 오류. 컨트롤러 오류는 code와 message를 반환하며 보안 필터 응답은 형식이 다를 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
      operationId: post_api_v1_admin_officer_terms_id_activate
  /api/v1/search:
    get:
      summary: 통합 검색
      description: '각 섹션의 커서는 독립적입니다. 다음 공지 및 게시물 페이지 요청에는 각각

        nextNoticeCursor와 nextNoticeRank, nextPostCursor와 nextPostRank를 함께 전달합니다.

        회원 및 권한 검사가 필요합니다. 결과 항목의 필드명은 SQL 조회 결과를 따릅니다.

        '
      security:
      - bearerAuth: []
      - memberCookie: []
      parameters:
      - name: keyword
        in: query
        required: true
        schema:
          type: string
          maxLength: 100
      - name: postCursor
        in: query
        schema:
          type: integer
          format: int64
      - name: postRank
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 3
      - name: personCursor
        in: query
        schema:
          type: string
      - name: noticeCursor
        in: query
        schema:
          type: integer
          format: int64
      - name: noticeRank
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 3
      - name: size
        in: query
        schema:
          type: integer
          default: 10
        description: 서버가 1~100 범위로 조정합니다.
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                required:
                - shortcuts
                - posts
                - nextPostCursor
                - nextPostRank
                - people
                - nextPersonCursor
                - notices
                - nextNoticeCursor
                - nextNoticeRank
                properties:
                  shortcuts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        keywords:
                          type: string
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchPost'
                  notices:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchPost'
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        officer:
                          type: integer
                          enum:
                          - 0
                          - 1
                        organizations:
                          type: array
                          items:
                            type: string
                  nextPostCursor:
                    type: integer
                    format: int64
                    nullable: true
                  nextPostRank:
                    type: integer
                    nullable: true
                  nextPersonCursor:
                    type: string
                    nullable: true
                  nextNoticeCursor:
                    type: integer
                    format: int64
                    nullable: true
                  nextNoticeRank:
                    type: integer
                    nullable: true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 인증 필요
        '403':
          description: 권한 없음. 보안 필터 또는 컨트롤러에서 반환합니다.
        default:
          description: 요청 오류 또는 서버 오류. 컨트롤러 오류는 code와 message를 반환하며 보안 필터 응답은 형식이 다를 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
      operationId: get_api_v1_search
