components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_access_token
      description: dev 프로필에서는 dev_admin_access_token
    memberCookie:
      type: apiKey
      in: cookie
      name: member_access_token
      description: dev 프로필에서는 dev_member_access_token
  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    OfficerTerm:
      type: object
      properties:
        id:
          type: integer
          format: int64
        generation:
          type: integer
        phase:
          type: integer
        startedAt:
          type: string
          format: date
        endedAt:
          type: string
          format: date
        currentTerm:
          type: boolean
    SearchPost:
      type: object
      properties:
        id:
          type: integer
          format: int64
        post_kind:
          type: string
        club_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        body:
          type: string
          nullable: true
        summary:
          type: string
        created_at:
          oneOf:
          - type: string
            format: date-time
          - type: integer
        relevance:
          type: integer
          minimum: 1
          maximum: 3
        author_name:
          type: string
          nullable: true
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
      required:
      - identifier
      - password
    AuthResponse:
      type: object
      properties:
        scope:
          type: string
          enum:
          - MEMBER
          - ADMIN
        id:
          type: integer
          format: int64
        name:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
    TermOption:
      type: object
      properties:
        officerTermId:
          type: integer
          format: int64
        generation:
          type: integer
        phase:
          type: integer
        startedAt:
          type: string
          format: date
        endedAt:
          type: string
          format: date
        type:
          type: string
          enum:
          - CURRENT
          - NEXT
        selectable:
          type: boolean
    com_scg_alumni_api_auth_AuthController_AuthResponse:
      type: object
      properties:
        scope:
          type: string
          enum:
          - MEMBER
          - ADMIN
        id:
          type: integer
        name:
          type: string
        accessTokenExpiresAt:
          type: string
    com_scg_alumni_api_auth_AuthController_LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - identifier
      - password
    com_scg_alumni_api_auth_AuthController_SignupRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        admissionYear:
          type: integer
        majorName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: 8자 이상, 영문·숫자·특수문자 포함
      required:
      - userId
      - name
