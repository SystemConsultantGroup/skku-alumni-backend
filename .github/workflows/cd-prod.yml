name: CD-PROD-BE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  dockerimage_tag: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  dockerimage_name: scgskku/alumni-be-prod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: --------------- Code Repo ---------------
        run: echo "Code Repo"

      - name: Code Repo 불러오기
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      - name: Gradle build
        run: ./gradlew build

      - name: Docker 준비(1/4) - 메타데이터 생성
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: |
            ${{ env.dockerimage_name }}
          tags: |
            ${{ env.dockerimage_tag }}
            latest

      - name: Docker 준비(2/4) - QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker 준비(3/4) - buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 준비(4/4) - 레지스트리 로그인 (Docker Hub)
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드+푸시
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: --------------- Config Repo ---------------
        run: echo "[Config Repo]"

      - name: Config Repo 불러오기
        uses: actions/checkout@v6
        with:
          repository: SystemConsultantGroup/skku-alumni-config
          ref: main
          token: ${{ secrets.ACTION_TOKEN }}
          path: skku-alumni-config

      - name: Kustomize 준비
        uses: imranismail/setup-kustomize@v2.0.0

      - name: Config Repo 이미지 값 업데이트 (Kustomize)
        run: |
          cd skku-alumni-config/overlays/prod/be/
          kustomize edit set image ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
          echo "---- Updated kustomization.yaml ----"
          cat kustomization.yaml

      - name: Config Repo 변경사항 푸시
        run: |
          cd skku-alumni-config
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update alumni-be-prod image to ${{ env.dockerimage_tag }}"
          git push origin main

      - name: --------------- Clean Up ---------------
        run: echo "Clean Up"
