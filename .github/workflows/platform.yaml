name: Platform deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PLATFORM_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  bootstrap:
    needs: verify
    name: Build initial image locks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/systemconsultantgroup/alumni-platform-be:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Write immutable lock
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKLOAD: be
        run: |
          jq -n \
            --arg repository "https://github.com/$GITHUB_REPOSITORY.git" \
            --arg revision "$GITHUB_SHA" \
            --arg image "ghcr.io/systemconsultantgroup/alumni-platform-$WORKLOAD@$DIGEST" \
            '{source: {repository: $repository, revision: $revision}, image: $image}' > "$WORKLOAD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-lock-be
          path: be.json
          retention-days: 30

  deliver:
    needs: verify
    if: github.event_name == 'push' && vars.PLATFORM_DEPLOY_ENABLED == 'true'
    uses: SystemConsultantGroup/kubernetes/.github/workflows/build-image.yaml@1a4f2fd3cdd14187f6ae423fb27c04dc58aa90ee
    with:
      application: alumni
      workload: be
      image: ghcr.io/systemconsultantgroup/alumni-platform-be
    secrets:
      KUBERNETES_APP_ID: ${{ secrets.KUBERNETES_APP_ID }}
      KUBERNETES_APP_PRIVATE_KEY: ${{ secrets.KUBERNETES_APP_PRIVATE_KEY }}
