spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-scg.scg.skku.ac.kr}:${DB_PORT:3306}/${DB_NAME:skku_alumni_dev}?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:scg_dev}
    password: ${DB_PASSWORD:!@dnjrtlf*()}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:skku-alumni}
