spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:skku-alumni-prod}

cors:
  allowed-origins: >-
    https://alumni.scg.skku.ac.kr,
    https://admin.alumni.scg.skku.ac.kr

firebase:
  # 앱의 google-services.json 과 같은 프로젝트여야 한다
  # (release=skku-alumni-37619, debug=skku-alumni-dev). 어긋나면 기동이 실패한다.
  expected-project-id: skku-alumni-37619
