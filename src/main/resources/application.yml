spring:
  application:
    name: skku-alumni-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    # 문의 접수 알림을 보내는 SMTP. host 가 비어 있으면 메일 발송이 꺼진다(로컬·테스트).
    # scg.skku.ac.kr 자체 메일 서버는 587(STARTTLS)만 열려 있다.
    # 서버 인증서가 만료돼 검증이 실패하면 SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST=mail.scg.skku.ac.kr
    # 환경 변수로 그 호스트만 신뢰하게 할 수 있다. 인증서를 갱신하는 편이 먼저다.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000
  servlet:
    multipart:
      # 여기는 백스톱이다. 실제 정책은 각 엔드포인트가 정한다.
      # 게시글·프로필 사진 30MB, 회원 엑셀 10MB, 사진 일괄 등록 압축파일 200MB.
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:210MB}

server:
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # 메일 서버는 건강 지표에서 뺀다. starter-mail 을 넣으면 /actuator/health 가 호출될 때마다
    # SMTP 에 로그인해 보는데, 메일 설정이 비었거나 메일 서버가 느리면 서비스 전체가 DOWN(503)으로
    # 보인다. 메일은 문의 알림용 부가 기능이라 이것 때문에 서비스가 죽은 것처럼 보여서는 안 된다.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

firebase:
  # 서비스 계정 JSON의 경로 또는 JSON 본문. 비어 있으면 푸시 발송이 꺼진다.
  credentials: ${FIREBASE_CREDENTIALS:}
  # 이 환경이 써야 하는 Firebase 프로젝트. 자격 증명이 다른 프로젝트의 것이면 기동을
  # 실패시킨다. 개발 환경에 운영 키가 들어가 실제 임원에게 알림이 나가는 사고를 막는다.
  # 비워 두면 대조하지 않는다(로컬 전용). prod·dev 프로필에서 반드시 지정한다.
  expected-project-id: ${FIREBASE_EXPECTED_PROJECT_ID:}

auth:
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:2h}
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
  jwt-secret: ${AUTH_JWT_SECRET:local-development-secret-for-skku-alumni-auth-change-me}
  member-access-cookie-name: member_access_token
  member-refresh-cookie-name: member_refresh_token
  admin-access-cookie-name: admin_access_token
  admin-refresh-cookie-name: admin_refresh_token
  # 인증 쿠키를 붙일 도메인. 비우면 쿠키를 발급한 호스트에만 붙는다.
  # 웹(alumni.scg.skku.ac.kr)과 API(api.alumni.scg.skku.ac.kr)가 호스트가 달라서,
  # 비워 두면 웹의 서버 컴포넌트가 인증 없이 API 를 부르게 되고 목록이 늘 빈다.
  # 로컬은 localhost 하나뿐이라 비운다 — localhost 에 도메인을 주면 브라우저가 거부한다.
  cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  # 회원용 웹 주소. 비밀번호 재설정 링크가 이 주소로 만들어진다. prod·dev 프로필에서 덮어쓴다.
  member-web-url: ${AUTH_MEMBER_WEB_URL:http://localhost:4000}
  # 관리자 웹 주소. 문의 알림 메일의 [답변하기] 버튼이 이 주소로 연결된다.
  admin-web-url: ${AUTH_ADMIN_WEB_URL:http://localhost:3001}
  password-reset-link-ttl: ${AUTH_PASSWORD_RESET_LINK_TTL:72h}

inquiry:
  # 문의 접수 알림 메일의 보내는 주소.
  mail-from: ${INQUIRY_MAIL_FROM:scg@scg.skku.ac.kr}
