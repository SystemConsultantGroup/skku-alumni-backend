spring:
  application:
    name: skku-alumni-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # 여기는 백스톱이다. 실제 정책은 각 엔드포인트가 정한다.
      # 게시글·프로필 사진 30MB, 회원 엑셀 10MB, 사진 일괄 등록 압축파일 200MB.
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:210MB}

server:
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

auth:
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:2h}
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
  jwt-secret: ${AUTH_JWT_SECRET:local-development-secret-for-skku-alumni-auth-change-me}
  member-access-cookie-name: member_access_token
  member-refresh-cookie-name: member_refresh_token
  admin-access-cookie-name: admin_access_token
  admin-refresh-cookie-name: admin_refresh_token
